<div class="container">
  <div class="row">
    <div class="col s12 m6 offset-m3">
      <div class="card">
        <div class="card-content">
          <span class="card-title">Registro de Empleado</span>
          <form #empleadoForm="ngForm" (ngSubmit)="agregarEmpleado(empleadoForm)">
            <div class="input-field col s12">
              <input type="text" name="name" [(ngModel)]="empleadoService.selectedEmpleado.name" placeholder="Ingrese su nombre">
            </div>
            <div class="input-field col s12">
              <input type="text" name="position" [(ngModel)]="empleadoService.selectedEmpleado.position" placeholder="Ingrese su cargo">
            </div>
            <div class="input-field col s12">
              <input type="text" name="office" [(ngModel)]="empleadoService.selectedEmpleado.office" placeholder="Ingrese su lugar de trabajo">
            </div>
            <div class="input-field col s12">
              <input type="number" name="salary" [(ngModel)]="empleadoService.selectedEmpleado.salary" placeholder="Ingrese su salario">
            </div>
            <div class="card-action">
              <button class="btn right green" type="submit">Guardar</button>
              <button class="btn btn-secondary" type="button" (click)="resetForm(empleadoForm)">Limpiar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
